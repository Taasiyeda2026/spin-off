<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הרעיון שלנו מתעורר לחיים | טכנולוגיות החלל</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:#172d43;font-family:Arial,sans-serif;line-height:1.55}main{max-width:960px;margin:auto;padding:20px 16px 40px}header{background:#102d48;color:white;border-radius:20px;padding:24px}h1{font-size:clamp(24px,4vw,34px);margin:8px 0}p{margin:8px 0}header a{color:white}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1686bd;outline-offset:2px}.top,.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.progress{display:flex;gap:6px;margin:16px 0}.progress span{flex:1;background:#dbe5ed;border-radius:9px;padding:10px;text-align:center;font-weight:bold}.progress .active{background:#155b83;color:white}.panel{background:white;border:1px solid #d4e1e9;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #17354c0c}h2{margin:0 0 8px}h3{margin:0 0 8px;font-size:18px}.field{margin:18px 0}.field>label{display:block;font-weight:bold;margin-bottom:6px}textarea,input[type=text]{width:100%;border:1px solid #afc5d6;padding:10px;border-radius:9px;color:inherit;background:#fbfdff}textarea{min-height:75px;resize:vertical}.options{display:flex;flex-wrap:wrap;gap:8px}.chip{position:relative;display:flex;align-items:center;gap:8px;padding:10px 13px;border:1px solid #bdcfdd;border-radius:12px;background:#fff;cursor:pointer}.chip:has(input:checked){background:#e0f2fa;border-color:#1976a4;color:#103d5a}.chip input{accent-color:#155b83;width:18px;height:18px;margin:0}.btn{border:1px solid #b9cfde;border-radius:10px;background:white;padding:10px 16px;color:#163c59;font-weight:bold}.primary{background:#155b83;color:white;border-color:#155b83}.muted{color:#52677a;font-size:14px}.tip{padding:12px;background:#eaf5fb;border-radius:10px;margin:12px 0}.result{border:1px solid #c5d8e4;border-radius:13px;padding:16px;margin:12px 0}.result textarea{min-height:160px;direction:rtl}.error{color:#9d2727;font-weight:bold}.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.parts input{margin:4px 0}.nav{margin-top:20px}button:disabled{opacity:.5;cursor:default}@media(max-width:560px){.panel{padding:15px}.parts{grid-template-columns:1fr}.progress span{font-size:12px}.chip{padding:9px}.nav button{flex:1}}
</style></head><body><main><header><div class="top"><a href="index.html" id="home">⌂</a><button class="btn" id="lang">العربية</button></div><h1 id="title"></h1><p id="intro"></p></header><div class="progress" id="progress"></div><div id="panel" class="panel"></div><div class="nav"><button class="btn" id="back"></button><span class="muted" id="status" role="status"></span><button class="btn primary" id="next"></button></div><div class="nav"><button class="btn" id="reset"></button></div></main>
<script>
'use strict';
const KEY='spacetech_prompt_life_v2';
const $=id=>document.getElementById(id);
let state={lang:'he',step:0,kind:'',values:{},outputs:[]};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&['he','ar'].includes(x.lang))state={...state,...x,step:0,outputs:[]}}catch(e){}
const T=(h,a)=>state.lang==='ar'?a:h;
const types=[['physical','מוצר פיזי','منتج مادي'],['smart','מוצר חכם','منتج ذكي'],['web','אתר','موقع إلكتروني'],['app','אפליקציה','تطبيق']];
const groups={
aud:[['ילדים','أطفال'],['תלמידים','طلاب'],['משפחות','عائلات'],['מבוגרים','بالغون'],['עובדים','عاملون'],['אנשים עם מוגבלות','أشخاص ذوو إعاقة'],['בעלי חיים','حيوانات']],
shape:[['עגול','دائري'],['מלבני','مستطيل'],['גלילי','أسطواني'],['מעוגל','بحواف مستديرة'],['גמיש','مرن'],['מתקפל','قابل للطي']],
size:[['בכף היד','بحجم كف اليد'],['בגודל בקבוק','بحجم زجاجة'],['בגודל תיק','بحجم حقيبة'],['בגודל שולחן','بحجم طاولة'],['גדול יותר','أكبر من ذلك']],
material:[['פלסטיק','بلاستيك'],['מתכת','معدن'],['בד','قماش'],['גומי','مطاط'],['זכוכית','زجاج'],['חומר ממוחזר','مواد معاد تدويرها']],
colors:[['כחול','أزرق'],['לבן','أبيض'],['שחור','أسود'],['אפור','رمادي'],['ירוק','أخضر'],['כתום','برتقالي'],['סגול','بنفسجي'],['אדום','أحمر'],['צהוב','أصفر'],['כסף','فضي']],
components:[['ידית','مقبض'],['כפתור','زر'],['רצועה','حزام'],['גלגלים','عجلات'],['מכסה','غطاء'],['מסנן','مرشح'],['פתח','فتحة'],['מסך','شاشة'],['חיישן','مستشعر'],['נורית','ضوء مؤشر'],['סוללה','بطارية'],['פאנל סולארי','لوح شمسي']],
digital:[['כפתורים','أزرار'],['מפה','خريطة'],['התראות','تنبيهات'],['תמונות','صور'],['חיפוש','بحث'],['מדידה','قياس'],['הוראות','إرشادات'],['תרשים נתונים','مخطط بيانات'],['תפריט','قائمة']],
action:[['לוחצים','يضغط'],['לובשים','يرتدي'],['מחזיקים','يمسك'],['מניחים','يضع'],['פותחים','يفتح'],['מפעילים','يشغّل'],['קוראים מידע','يقرأ معلومات'],['מקבלים התראה','يتلقى تنبيها']],
place:[['בבית','في المنزل'],['בכיתה','في الصف'],['בחוץ','في الخارج'],['בדרך','أثناء التنقل'],['במקום העבודה','في مكان العمل']],
space:[['חיישנים ומדידה','المستشعرات والقياس'],['סינון מים','تنقية المياه'],['אוורור ונשימה','التهوية والتنفس'],['הגנה ובידוד','الحماية والعزل'],['תקשורת ובקרה','الاتصال والتحكم'],['אנרגיה סולארית','الطاقة الشمسية'],['חומרים מתקדמים','مواد متقدمة']],
look:[['פשוט ונקי','بسيط وواضح'],['מודרני','عصري'],['טכנולוגי','تقني'],['ידידותי','سهل ومريح'],['עתידני','مستقبلي']],
view:[['מבט קדמי','من الأمام'],['מבט מהצד','من الجانب'],['מבט אלכסוני','من زاوية مائلة']],
background:[['רקע בהיר ונקי','خلفية فاتحة ونظيفة'],['רקע כהה ונקי','خلفية داكنة ونظيفة'],['רקע בסביבת השימוש','خلفية من بيئة الاستخدام']],
ratio:[['ריבוע 1:1','مربع 1:1'],['לרוחב 4:3','أفقي 4:3'],['לאורך 3:4','عمودي 3:4']]
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=key=>state.values[key]??'';
const isDigital=()=>['web','app'].includes(state.kind);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...state,outputs:[]}));$('status').textContent=T('נשמר במכשיר','حُفظ على الجهاز')}catch(e){$('status').textContent=T('השמירה המקומית אינה זמינה','الحفظ المحلي غير متاح')}};
function textfield(k,h,a,ph,pa,multi=false){return '<div class="field"><label for="'+k+'">'+T(h,a)+'</label>'+(multi?'<textarea id="'+k+'" data-text="'+k+'" placeholder="'+esc(T(ph,pa))+'">'+esc(v(k))+'</textarea>':'<input type="text" id="'+k+'" data-text="'+k+'" maxlength="250" value="'+esc(v(k))+'" placeholder="'+esc(T(ph,pa))+'">')+'</div>'}
function chips(k,h,a,multi=true,custom=true){const vals=Array.isArray(v(k))?v(k):[];return '<div class="field"><h3>'+T(h,a)+'</h3><div class="options" role="group" aria-label="'+esc(T(h,a))+'">'+groups[k].map((o,i)=>'<label class="chip"><input type="'+(multi?'checkbox':'radio')+'" name="'+k+'" data-group="'+k+'" value="'+i+'" '+(vals.includes(i)?'checked':'')+'>'+T(...o)+'</label>').join('')+(multi?'':'<label class="chip"><input type="radio" name="'+k+'" data-group="'+k+'" value="-1" '+(!vals.length?'checked':'')+'>'+T('לא משנה','لا يهم')+'</label>')+'</div>'+(custom?'<input type="text" style="margin-top:8px" data-text="'+k+'Other" aria-label="'+esc(T(h,a))+' — '+T('אחר','آخر')+'" placeholder="'+T('משהו אחר? אפשר להוסיף כאן','شيء آخر؟ يمكن إضافته هنا')+'" value="'+esc(v(k+'Other'))+'">':'')+'</div>'}
function render(){
document.documentElement.lang=state.lang;$('lang').textContent=T('العربية','עברית');$('title').textContent=T('הרעיון שלנו מתעורר לחיים','فكرتنا تنبض بالحياة');$('intro').textContent=T('בחרו את מה שמתאים לרעיון שלכם. נהפוך אותו להוראות ליצירת תמונה!','اختاروا ما يناسب فكرتكم. سنحوّله إلى تعليمات لإنشاء صورة!');
$('progress').innerHTML=[T('1. הרעיון שלנו','1. فكرتنا'),T('2. איך הוא נראה','2. كيف يبدو'),T('3. יוצרים תמונות','3. ننشئ الصور')].map((x,i)=>'<span class="'+(i===state.step?'active':'')+'">'+x+'</span>').join('');
$('back').textContent=T('חזרה','رجوع');$('back').disabled=state.step===0;$('next').textContent=state.step===1?T('יצירת פרומפט','إنشاء التعليمات'):T('המשך','متابعة');$('next').hidden=state.step===2;$('reset').textContent=T('רעיון חדש / ניקוי','فكرة جديدة / مسح');let s='';
if(state.step===0){s='<h2>'+T('מה פיתחתם?','ماذا طوّرتم؟')+'</h2><div class="options">'+types.map(([k,h,a])=>'<label class="chip"><input type="radio" name="kind" data-kind="'+k+'" '+(state.kind===k?'checked':'')+'>'+T(h,a)+'</label>').join('')+'</div>'+textfield('name','שם הפתרון','اسم الحل','למשל: תיק חכם','مثلاً: حقيبة ذكية')+textfield('purpose','מה הפתרון שלכם עושה?','ماذا يفعل حلّكم؟','משפט אחד מהתכנון שלכם','جملة واحدة من تصميمكم',true)+chips('aud','למי הוא מיועד?','لمن هو مخصص؟')+chips('space','מה נתן לכם השראה מהחלל?','ما الذي ألهمكم من الفضاء؟')+'<p class="muted">'+T('אין צורך למלא כל אפשרות. בחרו רק מה ששייך לפתרון שלכם.','لا حاجة إلى ملء كل الخيارات. اختاروا فقط ما يناسب حلّكم.')+'</p>'}
if(state.step===1){s='<h2>'+T('תנו לרעיון שלכם צורה','أعطوا فكرتكم شكلاً')+'</h2><div class="tip">'+T('היעזרו בתכנון מהמפגש הקודם. סמנו רק פרטים שבאמת תכננתם.','استعينوا بتصميم اللقاء السابق. اختاروا فقط التفاصيل التي خططتم لها بالفعل.')+'</div>';
if(isDigital()){s+=chips('digital','מה מופיע במסך?','ماذا يظهر على الشاشة؟')+textfield('appearance','איך המסך נראה ומה מופיע איפה?','كيف تبدو الشاشة وأين تظهر عناصرها؟','למשל: מפה במרכז וכפתור עזרה למטה','مثلاً: خريطة في الوسط وزر مساعدة في الأسفل',true)}
else{s+=chips('shape','מה הצורה?','ما الشكل؟')+chips('size','מה הגודל בערך?','ما الحجم التقريبي؟',false)+chips('material','ממה הוא עשוי?','ممّ صُنع؟')+chips('components','מהם החלקים שתכננתם?','ما الأجزاء التي خططتم لها؟')+textfield('appearance','איך הוא נראה ואיפה נמצאים החלקים החשובים?','كيف يبدو وأين توجد الأجزاء المهمة؟','למשל: חיישן על הרצועה הימנית ונורית בחלק העליון','مثلاً: مستشعر على الحزام الأيمن وضوء في الأعلى',true)}
s+=chips('action','איך משתמשים בו?','كيف يستخدمونه؟')+textfield('operation','מה קורה בזמן השימוש?','ماذا يحدث أثناء الاستخدام؟','למשל: החיישן מזהה עומס והנורית נדלקת','مثلاً: يكتشف المستشعر الحمل ويضيء المؤشر',true)+chips('place','איפה משתמשים בו?','أين يستخدمونه؟')+chips('colors','אילו צבעים?','ما الألوان؟')+chips('look','איזה מראה מתאים?','أي مظهر يناسبه؟')+chips('view','מאיזו זווית להציג?','من أي زاوية نعرضه؟',false,false)+chips('background','איזה רקע?','أي خلفية؟',false,false)}
if(state.step===2){s='<h2>'+T('הפרומפט שלכם מוכן!','تعليماتكم جاهزة!')+'</h2><div class="tip">'+T('העתיקו פעם אחת את הפרומפט לכלי יצירת התמונות. הוא מבקש שלוש תמונות נפרדות של אותו פתרון. שמרו את התמונות שקיבלתם.','انسخوا التعليمات مرة واحدة إلى أداة إنشاء الصور. تطلب ثلاث صور منفصلة للحل نفسه. احفظوا الصور الناتجة.')+'</div>'+state.outputs.map((o,i)=>'<section class="result"><h3>'+esc(o.title)+'</h3><p class="muted">'+(i===0?T('שלוש תמונות בפרומפט אחד','ثلاث صور في طلب واحد'):T('תמונה נוספת – אם יש זמן','صورة إضافية إذا توفر الوقت'))+'</p><button class="btn primary" data-copy="'+i+'">'+T('העתקת פרומפט','نسخ التعليمات')+'</button></section>').join('')+'<p class="muted">'+T('המערכת מכינה הוראות בלבד. את התמונות יוצרים בכלי AI חיצוני לפי הנחיית המדריך.','تُعدّ المنظومة التعليمات فقط. تُنشأ الصور بأداة ذكاء اصطناعي خارجية وفق إرشادات المرشد.')+'</p>'}
$('panel').innerHTML=s+'<p id="error" class="error" role="alert"></p>';save();}
function picked(k){return (Array.isArray(v(k))?v(k):[]).filter(i=>i>=0&&groups[k][i]).map(i=>T(...groups[k][i])).concat(v(k+'Other')?[v(k+'Other')]:[]).join(', ')}
function generate(){
const type=types.find(x=>x[0]===state.kind);const line=(h,a,value)=>value?T(h,a)+': '+value+'\n':'';
let base=line('סוג הפתרון','نوع الحل',T(type[1],type[2]))+line('שם','الاسم',v('name'))+line('מטרה','الهدف',v('purpose'))+line('משתמשים','المستخدمون',picked('aud'))+line('השראה מהחלל (לא להוסיף רכיבים בגלל ההשראה בלבד)','الإلهام من الفضاء (لا تضف أجزاء لمجرد الإلهام)',picked('space'));
if(isDigital())base+=line('אלמנטים במסך','عناصر الشاشة',picked('digital'));else base+=line('צורה','الشكل',picked('shape'))+line('גודל','الحجم',picked('size'))+line('חומרים','المواد',picked('material'))+line('חלקים','الأجزاء',picked('components'));
base+=line('תיאור ומיקום מדויק','الوصف والموقع الدقيق',v('appearance'))+line('שימוש','الاستخدام',picked('action'))+line('אופן פעולה','طريقة العمل',v('operation'))+line('סביבה','البيئة',picked('place'))+line('צבעים','الألوان',picked('colors'))+line('סגנון','الأسلوب',picked('look'))+line('יחס תמונה קבוע לכל תמונה','نسبة أبعاد ثابتة لكل صورة','1:1');
const rules=T('צור כעת סט של שלוש תמונות נפרדות, כל אחת ריבועית ביחס 1:1, באותה איכות גבוהה. הפק שלושה קובצי תמונה עצמאיים ולא קולאז׳ או תמונה מחולקת. אל תיצור פוסטר, כרזה, מודעה, מסגרת, כותרת, תוויות, מקרא, חצי הסבר או סימני מים. אל תוסיף טקסט לתמונות, למעט טקסט ממשק חיוני וקצר בפתרון דיגיטלי. שמור על אותו עיצוב בדיוק בכל התמונות: צורה, צבעים, חומרים, מיקום חלקים ומבנה מסכים. אל תמציא רכיבים, יכולות או תוצאות. שנה את הקומפוזיציה בין התמונות בהתאם למטרה של כל אחת. אם פרט חזותי לא הוגדר, בחר מראה ניטרלי. מדובר בהדמיה רעיונית בלבד.','أنشئ الآن مجموعة من ثلاث صور منفصلة، كل صورة مربعة بنسبة 1:1 وبجودة عالية متساوية. أخرج ثلاثة ملفات صور مستقلة، لا صورة مجمعة أو مقسمة. لا تنشئ ملصقاً أو إعلاناً أو إطاراً أو عنواناً أو تسميات أو مفتاحاً توضيحياً أو أسهم شرح أو علامات مائية. لا تضف نصوصاً إلا نص واجهة قصيراً وضرورياً للحل الرقمي. حافظ على التصميم نفسه تماماً في الصور الثلاث: الشكل والألوان والمواد ومواقع الأجزاء وبنية الشاشات. لا تخترع أجزاء أو وظائف أو نتائج. غيّر التكوين بحسب هدف كل صورة. إذا لم يُحدد تفصيل بصري فاختر مظهراً محايداً. هذه محاكاة للفكرة فقط.');
const first=isDigital()?T('תמונה 1 — הצגת המסך הראשי בלבד, ללא אדם, על רקע נקי.','الصورة 1 — عرض الشاشة الرئيسية فقط دون أشخاص، على خلفية نظيفة.'):T('תמונה 1 — צילום מוצר מקצועי של המוצר לבדו, ללא אנשים או ידיים. רקע סטודיו נקי. הצג את המוצר בשלמותו.','الصورة 1 — تصوير احترافي للمنتج وحده دون أشخاص أو أيدٍ، على خلفية استوديو نظيفة. اعرض المنتج كاملاً.');
const second=T('תמונה 2 — אותו פתרון בשימוש טבעי של קהל היעד בסביבה שתוארה. הצג את הפעולה עצמה ולא צילום מוצר חוזר.','الصورة 2 — الحل نفسه أثناء استخدامه الطبيعي من الفئة المستهدفة في البيئة الموصوفة. اعرض فعل الاستخدام لا تكرار صورة المنتج.');
const third=isDigital()?T('תמונה 3 — תקריב של המסך או מצב הפעולה המרכזי שתואר. ללא המצאת מסכים או כפתורים חדשים.','الصورة 3 — لقطة مقربة للشاشة أو لحالة الاستخدام الرئيسية الموصوفة. لا تخترع شاشات أو أزراراً جديدة.'):T('תמונה 3 — תקריב ממוקד של החלקים החשובים ואופן הפעולה. השתמש במבט חתך רק אם המנגנון הפנימי תואר במפורש; אחרת הצג תקריב חיצוני מזווית אחרת. ללא אדם אם אינו נחוץ להסבר.','الصورة 3 — لقطة مقربة للأجزاء المهمة وطريقة العمل. استخدم مقطعاً داخلياً فقط إذا وُصفت الآلية الداخلية صراحة، وإلا اعرض لقطة خارجية من زاوية مختلفة. دون أشخاص إن لم يلزموا للتوضيح.');
state.outputs=[{title:T('סט התמונות של הפתרון שלנו','مجموعة صور حلّنا'),body:rules+'\n\n'+base+'\n'+first+'\n'+line('זווית מועדפת לתמונה הראשונה','الزاوية المفضلة للصورة الأولى',picked('view'))+second+'\n'+third+'\n\n'+T('אם הכלי אינו מסוגל להפיק שלוש תמונות בתשובה אחת, הפק את הראשונה והמשך לשתיים הנוספות באותה שיחה לפי הסדר, כאשר הראשונה משמשת ייחוס לעיצוב בלבד. אל תחליף את הסט בקולאז׳.','إذا لم تستطع الأداة إنتاج ثلاث صور في رد واحد، أنشئ الأولى ثم تابع الصورتين الأخريين في المحادثة نفسها بالترتيب، مع اعتماد الأولى مرجعاً للتصميم فقط. لا تستبدل المجموعة بصورة مجمعة.')}];}

$('panel').addEventListener('input',e=>{if(e.target.dataset.text){state.values[e.target.dataset.text]=e.target.value;state.outputs=[];save()}});
$('panel').addEventListener('change',e=>{const el=e.target;if(el.dataset.kind){if(state.kind!==el.dataset.kind){state.kind=el.dataset.kind;for(const k of ['shape','size','material','components','digital','appearance','operation','action']){delete state.values[k];delete state.values[k+'Other']}}}else if(el.dataset.group){const k=el.dataset.group;state.values[k]=[...document.querySelectorAll('input[data-group="'+k+'"]:checked')].map(x=>Number(x.value)).filter(x=>x>=0)}state.outputs=[];save()});
$('panel').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const value=state.outputs[Number(b.dataset.copy)]?.body;if(!value)return;try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(value)}catch(err){const temp=document.createElement('textarea');temp.value=value;temp.setAttribute('readonly','');temp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(temp);temp.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}finally{temp.remove();b.focus()}if(!ok){$('status').textContent=T('לא הצלחנו להעתיק. נסו שוב או פנו למדריך.','تعذر النسخ. حاولوا مجدداً أو اطلبوا مساعدة المرشد.');return}}b.textContent=T('הועתק ✓','تم النسخ ✓');$('status').textContent=T('הפרומפט הועתק. אפשר להדביק בכלי יצירת התמונות.','تم نسخ التعليمات. يمكن لصقها في أداة إنشاء الصور.')});
$('next').onclick=()=>{if(state.step===0){if(!state.kind||!String(v('name')).trim()||!String(v('purpose')).trim()){$('error').textContent=T('בחרו סוג פתרון וכתבו שם ומשפט קצר על הרעיון.','اختاروا نوع الحل واكتبوا اسماً وجملة قصيرة عن الفكرة.');return}state.step=1}else if(state.step===1){if(!String(v('appearance')).trim()){$('error').textContent=T('הוסיפו משפט קצר על המראה ומיקום הפרטים החשובים כדי שהתמונה תתאים לרעיון שלכם.','أضيفوا جملة قصيرة عن الشكل ومواقع التفاصيل المهمة لتناسب الصورة فكرتكم.');$('appearance').focus();return}generate();state.step=2}render();window.scrollTo(0,0)};
$('back').onclick=()=>{state.step=Math.max(0,state.step-1);render();window.scrollTo(0,0)};
$('lang').onclick=()=>{state.lang=state.lang==='he'?'ar':'he';if(state.step===2)generate();render()};
$('reset').onclick=()=>{if(confirm(T('להתחיל רעיון חדש? הבחירות הנוכחיות יימחקו.','بدء فكرة جديدة؟ ستُمسح الاختيارات الحالية.'))){state={lang:state.lang,step:0,kind:'',values:{},outputs:[]};render()}};
render();
</script></body></html>
