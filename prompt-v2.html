}
$('panel').addEventListener('click',async e=>{
const b=e.target.closest('[data-copy],[data-provider]');if(!b||b.disabled)return;const value=state.outputs[0]?.body;if(!value)return;
const provider=b.dataset.provider;const feedback=$('launchFeedback');feedback.textContent='';b.disabled=true;
try{
const ok=await copyPrompt(value);
if(!ok){feedback.textContent=T('לא הצלחנו להעתיק. נסו שוב באמצעות כפתור ההעתקה.','تعذر النسخ. حاولوا مجدداً باستخدام زر النسخ.');return}
if(!provider){b.textContent=T('הועתק ✓','تم النسخ ✓');feedback.textContent=T('הפרומפט הועתק.','تم نسخ التعليمات.');return}
const encoded=encodeURIComponent(value);const prefill=provider==='chatgpt'&&encoded.length<14000;const url=prefill?providers[provider]+'?q='+encoded:providers[provider];
feedback.textContent=prefill?T('הפרומפט הועתק. אם לא מופיע בשיחה, הדביקו אותו (Ctrl+V).','تم النسخ. إذا لم تظهر التعليمات، الصقوها (Ctrl+V).'):T('הפרומפט הועתק. בחלון המחולל לחצו בשדה ההודעה והדביקו (Ctrl+V).','تم النسخ. اضغطوا على حقل الرسالة في الأداة والصقوا (Ctrl+V).');
const tab=window.open('about:blank','_blank');
if(tab){tab.opener=null;tab.location.href=url}else{const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=T('פתיחת המחולל','فتح الأداة');link.style.cssText='display:block;margin:8px auto;color:#155b83;text-decoration:underline';feedback.appendChild(link)}
}finally{b.disabled=false}
});
$('next').onclick=()=>{if(state.step===0){if(selectedDomain()===null||editingDomain){$('error').textContent=T('בחרו את תחום הרעיון שלכם.','اختاروا مجال فكرتكم.');return}if(!state.kind||!String(v('name')).trim()||!String(v('purpose')).trim()){$('error').textContent=T('בחרו סוג פתרון וכתבו שם ומשפט קצר על הרעיון.','اختاروا نوع الحل واكتبوا اسماً وجملة قصيرة عن الفكرة.');return}state.step=1}else if(state.step===1){if(!String(v('appearance')).trim()){$('error').textContent=T('הוסיפו משפט קצר על המראה ומיקום הפרטים החשובים כדי שהתמונה תתאים לרעיון שלכם.','أضيفوا جملة قصيرة عن الشكل ومواقع التفاصيل المهمة لتناسب الصورة فكرتكم.');$('appearance').focus();return}generate();state.step=2}render();window.scrollTo(0,0)};
$('back').onclick=()=>{state.step=Math.max(0,state.step-1);render();window.scrollTo(0,0)};
$('lang').onclick=()=>{state.lang=state.lang==='he'?'ar':'he';if(state.step===2)generate();render()};
$('reset').onclick=()=>{if(confirm(T('להתחיל רעיון חדש? הבחירות הנוכחיות יימחקו.','بدء فكرة جديدة؟ ستُمسح الاختيارات الحالية.'))){state={lang:state.lang,step:0,kind:'',values:{},outputs:[]};editingDomain=false;render();window.scrollTo(0,0)}};
render();
</script></body></html>
