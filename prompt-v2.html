<script>
'use strict';
const KEY='spacetech_prompt_life_v2';
const $=id=>document.getElementById(id);
let state={lang:'he',step:0,kind:'',values:{},outputs:[]};

const T=(h,a)=>state.lang==='ar'?a:h;
const types=[['physical','מוצר פיזי','منتج مادي'],['smart','מוצר חכם','منتج ذكي'],['web','אתר','موقع إلكتروني'],['app','אפליקציה','تطبيق']];
const groups={

shape:[['עגול','دائري'],['מלבני','مستطيل'],['גלילי','أسطواني'],['מעוגל','بحواف مستديرة'],['גמיש','مرن'],['מתקפל','قابل للطي']],
size:[['בכף היד','بحجم كف اليد'],['בגודל בקבוק','بحجم زجاجة'],['בגודל תיק','بحجم حقيبة'],['בגודל שולחן','بحجم طاولة'],['גדול יותר','أكبر من ذلك']],
material:[['פלסטיק','بلاستيك'],['מתכת','معدن'],['בד','قماش'],['גומי','مطاط'],['זכוכית','زجاج'],['חומר ממוחזר','مواد معاد تدويرها']],
colors:[['כחול','أزرق'],['לבן','أبيض'],['שחור','أسود'],['אפור','رمادي'],['ירוק','أخضر'],['כתום','برتقالي'],['סגול','بنفسجي'],['אדום','أحمر'],['צהוב','أصفر'],['כסף','فضي']],
components:[['ידית','مقبض'],['כפתור','زر'],['רצועה','حزام'],['גלגלים','عجلات'],['מכסה','غطاء'],['מסנן','مرشح'],['פתח','فتحة'],['מסך','شاشة'],['חיישן','مستشعر'],['נורית','ضوء مؤشر'],['סוללה','بطارية'],['פאנל סולארי','لوح شمسي']],
digital:[['כפתורים','أزرار'],['מפה','خريطة'],['התראות','تنبيهات'],['תמונות','صور'],['חיפוש','بحث'],['מדידה','قياس'],['הוראות','إرشادات'],['תרשים נתונים','مخطط بيانات'],['תפריט','قائمة']],
action:[['לוחצים','يضغط'],['לובשים','يرتدي'],['מחזיקים','يمسك'],['מניחים','يضع'],['פותחים','يفتح'],['מפעילים','يشغّل'],['קוראים מידע','يقرأ معلومات'],['מקבלים התראה','يتلقى تنبيها']],
place:[['בבית','في المنزل'],['בכיתה','في الصف'],['בחוץ','في الخارج'],['בדרך','أثناء التنقل'],['במקום העבודה','في مكان العمل']],
space:[['חיישנים ומדידה','المستشعرات والقياس'],['סינון מים','تنقية المياه'],['אוורור ונשימה','التهوية والتنفس'],['הגנה ובידוד','الحماية والعزل'],['תקשורת ובקרה','الاتصال والتحكم'],['אנרגיה סולארית','الطاقة الشمسية'],['חומרים מתקדמים','مواد متقدمة']],
look:[['פשוט ונקי','بسيط وواضح'],['מודרני','عصري'],['טכנולוגי','تقني'],['ידידותי','سهل ومريح'],['עתידני','مستقبلي']],
view:[['מבט קדמי','من الأمام'],['מבט מהצד','من الجانب'],['מבט אלכסוני','من زاوية مائلة']],
background:[['רקע בהיר ונקי','خلفية فاتحة ونظيفة'],['רקע כהה ונקי','خلفية داكنة ونظيفة'],['רקע בסביבת השימוש','خلفية من بيئة الاستخدام']],
ratio:[['ריבוע 1:1','مربع 1:1'],['לרוחב 4:3','أفقي 4:3'],['לאורך 3:4','عمودي 3:4']]
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=key=>state.values[key]??'';
const isDigital=()=>['web','app'].includes(state.kind);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...state,outputs:[]}));}catch(e){$('status').textContent=T('לא ניתן לשמור במכשיר','تعذر الحفظ على الجهاز')}};
function textfield(k,h,a,ph,pa,multi=false){return '<div class="field"><label for="'+k+'">'+T(h,a)+'</label>'+(multi?'<textarea id="'+k+'" data-text="'+k+'" placeholder="'+esc(T(ph,pa))+'">'+esc(v(k))+'</textarea>':'<input type="text" id="'+k+'" data-text="'+k+'" maxlength="250" value="'+esc(v(k))+'" placeholder="'+esc(T(ph,pa))+'">')+'</div>'}
function chips(k,h,a,multi=true,custom=true){const vals=Array.isArray(v(k))?v(k):[];return '<div class="field"><h3>'+T(h,a)+'</h3><div class="options" role="group" aria-label="'+esc(T(h,a))+'">'+groups[k].map((o,i)=>'<label class="chip"><input type="'+(multi?'checkbox':'radio')+'" name="'+k+'" data-group="'+k+'" value="'+i+'" '+(vals.includes(i)?'checked':'')+'>'+T(...o)+'</label>').join('')+(multi?'':'<label class="chip"><input type="radio" name="'+k+'" data-group="'+k+'" value="-1" '+(!vals.length?'checked':'')+'>'+T('לא משנה','لا يهم')+'</label>')+'</div>'+(custom?'<details class="other" '+(v(k+'Other')?'open':'')+'><summary>'+T('אפשרות נוספת','خيار إضافي')+'</summary><input type="text" data-text="'+k+'Other" aria-label="'+esc(T(h,a))+' — '+T('אחר','آخر')+'" placeholder="'+T('משהו אחר? אפשר להוסיף כאן','شيء آخر؟ يمكن إضافته هنا')+'" value="'+esc(v(k+'Other'))+'"></details>':'')+'</div>'}
function render(){
document.documentElement.lang=state.lang;$('lang').textContent=T('العربية','עברית');$('title').textContent=T('הרעיון שלנו מתעורר לחיים','فكرتنا تنبض بالحياة');$('intro').textContent=T('טכנולוגיות החלל | יוצרים תמונות של הפתרון שלנו','تقنيات الفضاء | ننشئ صوراً لحلّنا');
$('progress').innerHTML=[T('1. הרעיון שלנו','1. فكرتنا'),T('2. איך הוא נראה','2. كيف يبدو'),T('3. יוצרים תמונות','3. ننشئ الصور')].map((x,i)=>'<span class="'+(i===state.step?'active':i<state.step?'done':'')+'">'+x+'</span>').join('');
$('back').textContent=T('חזרה','رجوع');$('back').hidden=state.step===0;$('back').disabled=state.step===0;$('home').textContent=T('דף הבית','الصفحة الرئيسية');$('status').textContent='';$('next').textContent=state.step===1?T('יצירת פרומפט','إنشاء التعليمات'):T('המשך','متابعة');$('next').hidden=state.step===2;$('reset').textContent=T('רעיון חדש','فكرة جديدة');let s='';
if(state.step===0){s='<h2>'+T('מה פיתחתם?','ماذا طوّرتم؟')+'</h2><div class="options">'+types.map(([k,h,a])=>'<label class="chip"><input type="radio" name="kind" data-kind="'+k+'" '+(state.kind===k?'checked':'')+'>'+T(h,a)+'</label>').join('')+'</div>'+textfield('name','שם הפתרון','اسم الحل','למשל: תיק חכם','مثلاً: حقيبة ذكية')+textfield('purpose','מה הפתרון שלכם עושה?','ماذا يفعل حلّكم؟','משפט אחד מהתכנון שלכם','جملة واحدة من تصميمكم',true)+chips('aud','למי הוא מיועד?','لمن هو مخصص؟')+chips('space','מה נתן לכם השראה מהחלל?','ما الذي ألهمكم من الفضاء؟')}
if(state.step===1){s='<h2>'+T('תנו לרעיון שלכם צורה','أعطوا فكرتكم شكلاً')+'</h2><div class="tip">'+T('היעזרו בתכנון מהמפגש הקודם. סמנו רק פרטים שבאמת תכננתם.','استعينوا بتصميم اللقاء السابق. اختاروا فقط التفاصيل التي خططتم لها بالفعل.')+'</div>';
if(isDigital()){s+=chips('digital','מה מופיע במסך?','ماذا يظهر على الشاشة؟')+textfield('appearance','איך המסך נראה ומה מופיע איפה?','كيف تبدو الشاشة وأين تظهر عناصرها؟','למשל: מפה במרכז וכפתור עזרה למטה','مثلاً: خريطة في الوسط وزر مساعدة في الأسفل',true)}
else{s+=chips('shape','מה הצורה?','ما الشكل؟')+chips('size','מה הגודל בערך?','ما الحجم التقريبي؟',false)+chips('material','ממה הוא עשוי?','ممّ صُنع؟')+chips('components','מהם החלקים שתכננתם?','ما الأجزاء التي خططتم لها؟')+textfield('appearance','איך הוא נראה ואיפה נמצאים החלקים החשובים?','كيف يبدو وأين توجد الأجزاء المهمة؟','למשל: חיישן על הרצועה הימנית ונורית בחלק העליון','مثلاً: مستشعر على الحزام الأيمن وضوء في الأعلى',true)}
s+=chips('action','איך משתמשים בו?','كيف يستخدمونه؟')+textfield('operation','מה קורה בזמן השימוש?','ماذا يحدث أثناء الاستخدام؟','למשל: החיישן מזהה עומס והנורית נדלקת','مثلاً: يكتشف المستشعر الحمل ويضيء المؤشر',true)+chips('place','איפה משתמשים בו?','أين يستخدمونه؟')+chips('colors','אילו צבעים?','ما الألوان؟')+chips('look','איזה מראה מתאים?','أي مظهر يناسبه؟')}
if(state.step===2){s='<div class="finish"><div class="mark" aria-hidden="true">✓</div><h2>'+T('הפרומפט שלכם מוכן!','تعليماتكم جاهزة!')+'</h2><p>'+T('בחרו כלי ליצירת תמונות. הפרומפט יועתק אוטומטית.','اختاروا أداة لإنشاء الصور. ستُنسخ التعليمات تلقائياً.')+'</p><section class="result"><div class="launchers"><button class="btn primary" data-copy="0">'+T('העתקת פרומפט','نسخ التعليمات')+'</button><button class="btn provider" data-provider="chatgpt">ChatGPT ↗</button><button class="btn provider" data-provider="gemini">Gemini ↗</button><button class="btn provider" data-provider="copilot">Copilot ↗</button><button class="btn provider" data-provider="claude">Claude <small>'+T('טקסט','نص')+'</small> ↗</button></div><p class="launch-feedback" id="launchFeedback" role="status"></p></section><p class="muted">'+T('אם התקבלה תמונה אחת בלבד, כתבו ״הבא״ באותה שיחה.','إذا حصلتم على صورة واحدة فقط، اكتبوا «التالي» في المحادثة نفسها.')+'</p></div>'}

$('panel').innerHTML=s+'<p id="error" class="error" role="alert"></p>';save();}
function picked(k){return (Array.isArray(v(k))?v(k):[]).filter(i=>i>=0&&groups[k][i]).map(i=>T(...groups[k][i])).concat(v(k+'Other')?[v(k+'Other')]:[]).join(', ')}
const EN={
aud:['children','school students','families','adults','workers','people with disabilities','animals'],
shape:['round','rectangular','cylindrical','rounded edges','flexible','foldable'],
size:['palm-sized','bottle-sized','backpack-sized','table-sized','larger than a table'],
material:['plastic','metal','fabric','rubber','glass','recycled materials'],
colors:['blue','white','black','gray','green','orange','purple','red','yellow','silver'],
components:['handle','button','strap','wheels','lid','filter','opening','screen','sensor','indicator light','battery','solar panel'],
digital:['buttons','map','notifications','images','search','measurement','instructions','data chart','menu'],
action:['pressing','wearing','holding','placing','opening','activating','reading information','receiving an alert'],
place:['at home','in a classroom','outdoors','while traveling','at work'],
space:['sensors and measurement','water filtration','ventilation and breathing','protection and insulation','communication and control','solar energy','advanced materials'],
look:['simple and clean','modern','technological','user-friendly','futuristic'],
view:['front view','side view','three-quarter view'],
background:['clean light background','clean dark background','natural usage environment']
};
function generate(){
const line=(label,value)=>String(value??'').trim()?label+': '+String(value).trim()+'\n':'';
const pickedEN=k=>(Array.isArray(v(k))?v(k):[]).map(i=>EN[k]?.[i]).filter(Boolean).join(', ');
const original={};
for(const k of ['name','purpose','appearance','operation',...(isDigital()?['aud','space','digital','action','place','colors','look']:['aud','space','shape','size','material','components','action','place','colors','look'])]){
 const value=['name','purpose','appearance','operation'].includes(k)?v(k):v(k+'Other');
 if(String(value??'').trim())original[k]=String(value).trim();
}
let base=line('Solution type',({physical:'Physical product',smart:'Smart product',web:'Website',app:'Mobile application'})[state.kind])+line('Target users',pickedEN('aud'))+line('Space technology inspiration (context only)',pickedEN('space'));
if(isDigital())base+=line('Planned interface elements',pickedEN('digital'));
else base+=line('Product shape',pickedEN('shape'))+line('Approximate physical scale',pickedEN('size'))+line('Materials',pickedEN('material'))+line('Specified components',pickedEN('components'));
base+=line('User actions',pickedEN('action'))+line('Usage setting',pickedEN('place'))+line('Color palette',pickedEN('colors'))+line('Visual style',pickedEN('look'));
const first=isDigital()?'IMAGE 1 — HERO VIEW: Show the planned main interface in a suitable device or browser presentation, without people. Use a clean studio background and keep the screen legible.':'IMAGE 1 — HERO VIEW: Professional studio product photography of the complete product alone, without people or hands. Use a clean neutral background and a viewpoint that best reveals the design and important external features.';
const third=isDigital()?'IMAGE 3 — FUNCTIONAL DETAIL: Show a close-up of a planned interface state or key interaction. Do not invent screens, buttons or data.':'IMAGE 3 — FUNCTIONAL DETAIL: One continuous, coherent close-up of the actual planned components and mechanism. Use a cutaway only when internal construction is explicitly specified. Otherwise show a meaningful external detail. Do not add wiring, connections or internal parts that were not specified.';
const instructions=[
'Act as a professional industrial-design visualization and product photography specialist. Generate actual images, not a written description or another prompt.',
'DELIVERABLE: Create three separate high-quality square images (1:1 aspect ratio each), using a single consistent design. Each image must be independently usable. No collages, split screens, inset panels or multi-view sheets.',

base,

JSON.stringify(original,null,2),

'DESIGN CONSISTENCY: Establish a single product identity and preserve its geometry, proportions, material, colors, component count, shape and exact placement across all three images. For digital solutions preserve the planned interface structure. Never relocate, duplicate or invent components for visibility or aesthetics. Space inspiration does not authorize additional technology. Do not fabricate performance results.',

state.outputs=[{title:T('סט התמונות של הפתרון שלנו','مجموعة صور حلّنا'),body:instructions}];
}
$('panel').addEventListener('input',e=>{if(e.target.dataset.text){state.values[e.target.dataset.text]=e.target.value;state.outputs=[];save()}});
$('panel').addEventListener('change',e=>{const el=e.target;if(el.dataset.kind){if(state.kind!==el.dataset.kind){state.kind=el.dataset.kind;for(const k of ['shape','size','material','components','digital','appearance','operation','action']){delete state.values[k];delete state.values[k+'Other']}}}else if(el.dataset.group){const k=el.dataset.group;state.values[k]=[...document.querySelectorAll('input[data-group="'+k+'"]:checked')].map(x=>Number(x.value)).filter(x=>x>=0)}state.outputs=[];save()});
const providers={chatgpt:'https://chatgpt.com/',gemini:'https://gemini.google.com/app',copilot:'https://copilot.microsoft.com/',claude:'https://claude.ai/new'};
async function copyPrompt(value){
try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(value);return true}catch(err){const temp=document.createElement('textarea');temp.value=value;temp.setAttribute('readonly','');temp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(temp);temp.select();try{return document.execCommand('copy')}catch(e){return false}finally{temp.remove()}}
}
$('panel').addEventListener('click',async e=>{
const b=e.target.closest('[data-copy],[data-provider]');if(!b)return;const value=state.outputs[0]?.body;if(!value)return;
const provider=b.dataset.provider;const feedback=$('launchFeedback');
if(provider==='claude'&&!confirm(T('Claude מיועד כאן לעבודה עם טקסט ואינו מחולל תמונות ריאליסטיות ישירות. לפתוח בכל זאת?','Claude مخصص هنا للعمل مع النصوص ولا ينشئ صوراً واقعية مباشرة. هل تريدون فتحه؟')))return;
let tab=null;if(provider){tab=window.open('about:blank','_blank');if(tab)tab.opener=null}
const ok=await copyPrompt(value);
if(!ok){if(tab)tab.close();feedback.textContent=T('לא הצלחנו להעתיק. נסו שוב או פנו למדריך.','تعذر النسخ. حاولوا مجدداً أو اطلبوا مساعدة المرشد.');return}
if(provider){if(tab){tab.location.href=providers[provider];feedback.textContent=T('הועתק! הדביקו בחלון שנפתח (Ctrl+V).','تم النسخ! الصقوا في النافذة الجديدة (Ctrl+V).')}else{feedback.textContent=T('הועתק! פתיחת החלון נחסמה. אפשרו חלונות קופצים ונסו שוב.','تم النسخ! مُنع فتح النافذة. اسمحوا بالنوافذ المنبثقة وحاولوا مجدداً.')}}
else{b.textContent=T('הועתק ✓','تم النسخ ✓');feedback.textContent=T('הפרומפט הועתק.','تم نسخ التعليمات.')}
});
$('next').onclick=()=>{if(state.step===0){if(!state.kind||!String(v('name')).trim()||!String(v('purpose')).trim()){$('error').textContent=T('בחרו סוג פתרון וכתבו שם ומשפט קצר על הרעיון.','اختاروا نوع الحل واكتبوا اسماً وجملة قصيرة عن الفكرة.');return}state.step=1}else if(state.step===1){if(!String(v('appearance')).trim()){$('error').textContent=T('הוסיפו משפט קצר על המראה ומיקום הפרטים החשובים כדי שהתמונה תתאים לרעיון שלכם.','أضيفوا جملة قصيرة عن الشكل ومواقع التفاصيل المهمة لتناسب الصورة فكرتكم.');$('appearance').focus();return}generate();state.step=2}render();window.scrollTo(0,0)};
$('back').onclick=()=>{state.step=Math.max(0,state.step-1);render();window.scrollTo(0,0)};
$('lang').onclick=()=>{state.lang=state.lang==='he'?'ar':'he';if(state.step===2)generate();render()};
$('reset').onclick=()=>{if(confirm(T('להתחיל רעיון חדש? הבחירות הנוכחיות יימחקו.','بدء فكرة جديدة؟ ستُمسح الاختيارات الحالية.'))){state={lang:state.lang,step:0,kind:'',values:{},outputs:[]};render()}};
render();
</script></body></html>
