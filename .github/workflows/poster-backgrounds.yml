name: Build and deploy SpaceTech
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: spacetech-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Validate automatic catalog and immutable history
        run: python tests/poster-background-build.test.py
      - name: Build deployment with generated catalog and thumbnails
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          python scripts/build-poster-backgrounds.py --output _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  production-acceptance:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0 Pillow==11.3.0 PyMuPDF==1.26.6
      - name: Render the deployed interface and inspect real production PDFs
        env:
          POSTER_TEST_URL: https://taasiyeda2026.github.io/spin-off/poster.html?release=${{ github.sha }}
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          python tests/poster-layout-design.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-poster-acceptance
          path: test-results/poster-acceptance
