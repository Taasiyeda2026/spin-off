name: Poster typography and header
on:
  pull_request:
    paths: ['poster.html', 'poster-access.css', 'tests/poster-header.browser.py', '.github/workflows/poster-header.yml']
  push:
    branches: [main]
    paths: ['poster.html', 'poster-access.css', 'tests/poster-header.browser.py', '.github/workflows/poster-header.yml']
permissions:
  contents: read
jobs:
  focused-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0 Pillow==11.3.0 PyMuPDF==1.26.6
      - run: python scripts/build-poster-backgrounds.py
      - name: Check Hebrew and Arabic layout and A4 PDF
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/poster-header-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python tests/poster-header.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poster-header-review
          path: test-results/poster-header
