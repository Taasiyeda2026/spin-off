name: Poster gallery checks
on:
  pull_request:
    paths:
      - 'poster*.html'
      - 'prompt*.html'
      - 'poster*.js'
      - 'poster*.css'
      - 'poster-backgrounds/**'
      - 'tests/poster-*'
      - 'supabase/**'
      - '.github/workflows/poster-gallery-checks.yml'
  push:
    branches: [main]
    paths:
      - 'poster*.html'
      - 'prompt*.html'
      - 'poster*.js'
      - 'poster*.css'
      - 'poster-backgrounds/**'
      - 'tests/poster-*'
      - 'supabase/**'
      - '.github/workflows/poster-gallery-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Database authorization and submission acceptance
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createdb poster_test
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d poster_test -f tests/poster-cloud-fixture.sql -f supabase/migrations/20261125130000_cloud_posters.sql -f supabase/migrations/20261125142634_poster_allow_empty_participants_on_creation.sql -f tests/poster-cloud.acceptance.sql -f tests/poster-manager.acceptance.sql -f tests/poster-submit-logo.acceptance.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test tests/poster-media.test.mjs
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install playwright==1.56.0 Pillow==11.3.0 PyMuPDF==1.26.6
          google-chrome --version
      - name: Check generated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root = Path('poster-backgrounds')
          catalog = (root/'catalog.js').read_text()
          entries = json.loads(catalog.removeprefix('window.posterBackgroundCatalog = ').strip().removesuffix(';'))
          sources = [p for p in root.iterdir() if p.is_file() and p.suffix.lower() in ('.png','.jpg','.jpeg')]
          assert {e['id'] for e in entries} == {p.stem for p in sources}
          for e in entries:
              for field in ('image','thumb'):
                  with Image.open(e[field]) as image:
                      assert image.format == 'WEBP'
                      if field == 'thumb': assert image.width <= 240 and image.height <= 340
                      image.verify()
          print(f'Validated {len(entries)} full backgrounds and previews.')
          PY
      - name: Browser acceptance
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/poster-gallery-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do if curl -fsS http://127.0.0.1:8000/poster.html >/dev/null; then break; fi; sleep 1; done
          python tests/poster-drafts.browser.py
          python tests/poster-cloud.browser.py
          python tests/poster-submit-logo.browser.py
