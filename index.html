<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020713">
  <meta name="description" content="SPIN-OFF — אתר הקורס טכנולוגיות החלל של תעשיידע">
  <title>SPIN-OFF | תעשיידע</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <main class="home-stage" aria-label="SPIN-OFF — אתר הקורס טכנולוגיות החלל">
    <!--
      ניווט ראשי:
      השורה העליונה מחוברת מימין לשמאל: בינגו, ספינאוף, פרומפט.
      פוסטר עבר לשורה השנייה, ושני הכפתורים הנוספים נשארים בקרוב.
    -->
    <nav class="home-nav" aria-label="ניווט ראשי בקורס">
      <a class="nav-card" href="prompt.html"><span style="color:#ffffff">פרומפט</span></a>
      <a class="nav-card" href="spinoff.html"><span style="color:#ffffff">ספינאוף</span></a>
      <a class="nav-card" href="bingo/bingo.html"><span style="color:#ffffff">בינגו</span></a>
      <a class="nav-card is-coming" href="#" data-coming-soon><span>בקרוב</span></a>
      <a class="nav-card is-coming" href="#" data-coming-soon><span>בקרוב</span></a>
      <a class="nav-card" href="poster.html"><span style="color:#ffffff">פוסטר</span></a>
    </nav>
  </main>

  <div class="status-toast" id="status-toast" role="status" aria-live="polite">העמוד ייפתח בקרוב</div>

  <script>
    (() => {
      const toast = document.getElementById('status-toast');
      let timer;

      document.querySelectorAll('[data-coming-soon]').forEach((link) => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          clearTimeout(timer);
          toast.classList.add('is-visible');
          timer = setTimeout(() => toast.classList.remove('is-visible'), 1400);
        });
      });
    })();
  </script>
</body>
</html>
